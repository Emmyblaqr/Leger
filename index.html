              (r.lastPosted === monthOf(today()) ? " · done this month" : "") + "</span></span>" +
              '<span class="amt">' + money(r.amount) + "</span>" +
              '<button class="dim" style="padding:4px" onclick="S.recurring=S.recurring.filter(q=>q.id!==\'' + r.id + "');save();render()\" aria-label=\"Remove\">" + icon("x", 15) + "</button></div>"
          )
          .join("")
      : '<div class="empty">Rent, data, transfers you make every month — set them once and just tap Log when they show up.</div>') +
      '<button class="btn ghost sm" style="width:100%;margin-top:14px" onclick="openSheet(\'recurring\')">Add a monthly repeat</button>'
  );

  out += card(
    "Notes to self",
    "",
    (S.notes.length
      ? S.notes
          .map(
            (n) =>
              '<div class="item" style="cursor:default;align-items:flex-start"><span class="grow" style="font-size:14px;white-space:pre-wrap">' + esc(n.text) +
              '<span class="mini dim" style="display:block;margin-top:4px">' + shortDate(n.at) + "</span></span>" +
              '<button class="dim" style="padding:4px" onclick="S.notes=S.notes.filter(q=>q.id!==\'' + n.id + "');save();render()\" aria-label=\"Remove note\">" + icon("x", 15) + "</button></div>"
          )
          .join("")
      : "") +
      '<textarea id="newnote" rows="2" placeholder="Anything you want to remember about money…" style="margin-top:' + (S.notes.length ? "12px" : "0") + '"></textarea>' +
      '<button class="btn ghost sm" style="width:100%;margin-top:8px" onclick="addNote()">Save note</button>'
  );
  return out;
}
function addNote() {
  const el = document.getElementById("newnote");
  const t = (el.value || "").trim();
  if (!t) return;
  S.notes.unshift({ id: uid(), text: t, at: today() });
  save();
  render();
  toast("Note saved");
}
function editExpected(id) {
  UI.sheet = { name: "expected", arg: { id: id || null } };
  render();
}
function expectedSheet() {
  const x = UI.sheet.arg.id ? S.expected.find((q) => q.id === UI.sheet.arg.id) : null;
  return (
    '<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>' + (x ? "Edit" : "Money you're expecting") + "</h2>" +
    '<button class="ico" onclick="closeSheet()" aria-label="Close">' + icon("x") + "</button></div>" +
    '<div class="field"><div class="label">What is it?</div><input id="x_what" value="' + esc(x ? x.what : "") + '" placeholder="e.g. Data side gig — August"></div>' +
    '<div class="field"><div class="label">How much</div><input id="x_amount" type="number" inputmode="decimal" value="' + esc(x ? x.amount : "") + '" placeholder="' + S.settings.currency + '0"></div>' +
    '<div class="field"><div class="label">From who (optional)</div><input id="x_who" value="' + esc(x ? x.who || "" : "") + '" placeholder="Name or company"></div>' +
    '<div class="field"><div class="label">Expected when (optional)</div><input id="x_when" type="date" value="' + esc(x ? x.when || "" : "") + '"></div>' +
    '<div class="field"><div class="label">Note (optional)</div><input id="x_note" value="' + esc(x ? x.note || "" : "") + '" placeholder="Anything to remember"></div>' +
    '<button class="btn" onclick="saveExpected(' + (x ? "'" + x.id + "'" : "null") + ')">' + (x ? "Save changes" : "Add it") + "</button>" +
    (x ? '<button class="btn danger" style="margin-top:10px" onclick="S.expected=S.expected.filter(q=>q.id!==\'' + x.id + "');save();closeSheet()\">Remove</button>" : "")
  );
}
function saveExpected(id) {
  const g = (k) => document.getElementById("x_" + k).value;
  const what = g("what").trim();
  if (!what) return;
  const data = { what: what, amount: g("amount"), who: g("who").trim(), when: g("when"), note: g("note").trim() };
  if (id) Object.assign(S.expected.find((q) => q.id === id), data);
  else S.expected.unshift(Object.assign({ id: uid(), done: false }, data));
  save();
  closeSheet();
  toast(id ? "Updated" : "Added to what you're expecting");
}
function receiveExpected(id) {
  const x = S.expected.find((q) => q.id === id);
  if (!x) return;
  openAdd("income", { amount: String(parseFloat(x.amount) || ""), note: x.what, expectedId: id, to: firstAccount() });
}

/* recurring sheet */
function recurringSheet() {
  const accs = accounts();
  return (
    '<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>Monthly repeat</h2>' +
    '<button class="ico" onclick="closeSheet()" aria-label="Close">' + icon("x") + "</button></div>" +
    '<div class="note">Set it once. Each month the app shows it on your home screen and you tap Log — nothing is written without you.</div>' +
    '<div class="field"><div class="label">Name it</div><input id="r_name" placeholder="e.g. Rent"></div>' +
    '<div class="field"><div class="label">What kind</div><select id="r_kind">' +
      ["expense", "income", "save"].map((k) => '<option value="' + k + '">' + KIND[k].label + "</option>").join("") +
    "</select></div>" +
    '<div class="field"><div class="label">How much</div><input id="r_amount" type="number" inputmode="decimal" placeholder="' + S.settings.currency + '0"></div>' +
    '<div class="field"><div class="label">Which source</div><select id="r_pot">' +
      accs.map((p) => '<option value="' + p.id + '">' + esc(p.name) + "</option>").join("") +
    "</select></div>" +
    '<div class="field"><div class="label">Which goal (only if saving)</div><select id="r_goal"><option value="">—</option>' +
      goals().map((p) => '<option value="' + p.id + '">' + esc(p.name) + "</option>").join("") +
    "</select></div>" +
    '<div class="field"><div class="label">Day of the month</div><input id="r_day" type="number" min="1" max="28" value="1"></div>' +
    '<button class="btn" onclick="saveRecurring()">Save repeat</button>'
  );
}
function saveRecurring() {
  const g = (k) => document.getElementById("r_" + k).value;
  const amount = parseFloat(g("amount"));
  const kind = g("kind");
  if (!(amount > 0)) return;
  const potId = g("pot"), goalId = g("goal");
  const r = {
    id: uid(), name: g("name").trim() || KIND[kind].label, kind: kind, amount: amount,
    from: kind === "income" ? null : potId,
    to: kind === "income" ? potId : kind === "save" ? goalId || null : null,
    cat: kind === "expense" ? "Bills" : "",
    day: clamp(parseInt(g("day"), 10) || 1, 1, 28),
    active: true, lastPosted: null,
  };
  if (kind === "save" && !r.to) return;
  S.recurring.push(r);
  save();
  closeSheet();
  toast("Repeat saved");
}

/* ============================================================
   SETTINGS + BACKUP
   ============================================================ */
function pageSettings() {
  const b = balances();
  let out =
    '<div class="top"><div><div class="eyebrow">This app</div><h1>Settings</h1></div>' +
    '<button class="ico" onclick="back()" aria-label="Back">' + icon("x") + "</button></div>";

  out += card(
    "Your money lives on this phone",
    "Backup",
    '<div class="tiny muted" style="margin-bottom:14px">Nothing is sent anywhere — which also means nobody can get it back for you. Save a copy sometimes, especially before clearing your browser or changing phone.</div>' +
    '<button class="btn ghost" onclick="exportData()">Save a backup file</button>' +
    '<div style="height:8px"></div><button class="btn ghost" onclick="copyData()">Copy backup as text</button>' +
    '<div style="height:8px"></div><label class="btn ghost" style="display:block;text-align:center;line-height:22px">Restore from a backup<input type="file" accept=".json,application/json" onchange="importFile(this)" style="display:none"></label>' +
    '<div class="mini dim center" style="margin-top:10px">' + S.entries.length + " entries · " + S.pots.length + " pots · last change " + (S.entries[0] ? shortDate(S.entries[0].date) : "—") + "</div>"
  );

  out += card(
    "Appearance",
    "",
    '<div class="seg">' +
    '<button aria-pressed="' + (S.settings.theme !== "light") + '" onclick="S.settings.theme=\'dark\';save();applyTheme();render()">' + icon("moon", 15) + " Dark</button>" +
    '<button aria-pressed="' + (S.settings.theme === "light") + '" onclick="S.settings.theme=\'light\';save();applyTheme();render()">' + icon("sun", 15) + " Light</button>" +
    "</div>"
  );

  out += card(
    "Sources of money",
    "Pots",
    accounts()
      .map(
        (p) =>
          '<div class="item" style="cursor:default"><span class="grow" style="font-size:14px">' + esc(p.name) + "</span>" +
          '<span class="num tiny dim">' + signed(b[p.id] || 0) + "</span>" +
          '<button class="dim" style="padding:4px" onclick="renamePot(\'' + p.id + '\')" aria-label="Rename">' + icon("gear", 15) + "</button></div>"
      )
      .join("") +
      '<div class="row" style="gap:8px;margin-top:12px"><input id="newpot" placeholder="Add a source"><button class="btn sm" onclick="addPot(document.getElementById(\'newpot\').value,\'account\');render()">Add</button></div>'
  );

  out += card(
    "Savings goals",
    "",
    (goals().length
      ? goals()
          .map(
            (p) =>
              '<div class="item" style="cursor:default"><span class="grow" style="font-size:14px">' + esc(p.name) + "</span>" +
              '<span class="num tiny dim">' + money(b[p.id] || 0) + (p.target ? " / " + money(p.target) : "") + "</span>" +
              '<button class="dim" style="padding:4px" onclick="renamePot(\'' + p.id + '\')" aria-label="Rename">' + icon("gear", 15) + "</button></div>"
          )
          .join("")
      : '<div class="empty">No goals yet — make one when you save.</div>')
  );

  out += card(
    "Categories",
    "",
    '<div class="wrap">' + S.cats.map((c) => '<span class="chip" style="cursor:default">' + esc(c) + "</span>").join("") + "</div>" +
    '<div class="row" style="gap:8px;margin-top:12px"><input id="newcat" placeholder="Add a category"><button class="btn sm" onclick="addCat(document.getElementById(\'newcat\').value);render()">Add</button></div>'
  );

  out += card(
    "Currency symbol",
    "",
    '<div class="row" style="gap:8px"><input id="cur" value="' + esc(S.settings.currency) + '" maxlength="3" style="width:80px">' +
    '<button class="btn sm" onclick="S.settings.currency=document.getElementById(\'cur\').value||\'₦\';save();render()">Set</button></div>'
  );

  out +=
    '<button class="btn danger" style="margin-bottom:24px" onclick="wipe()">Erase everything on this device</button>';
  return out;
}
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ledger-backup-" + today() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Backup saved to your downloads");
}
function copyData() {
  const txt = JSON.stringify(S);
  const done = () => toast("Backup copied — paste it somewhere safe");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done) {
  const t = document.createElement("textarea");
  t.value = txt;
  document.body.appendChild(t);
  t.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("Couldn't copy — use the backup file instead"); }
  t.remove();
}
function importFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.entries)) throw 0;
      if (!confirm("Replace what's on this phone with the backup? " + d.entries.length + " entries will load.")) return;
      S = Object.assign(blank(), d);
      S.settings = Object.assign(blank().settings, d.settings || {});
      save();
      UI.page = null;
      UI.tab = "home";
      render();
      toast("Backup restored");
    } catch (e) {
      toast("That file isn't a Ledger backup");
    }
  };
  r.readAsText(f);
}
function wipe() {
  if (!confirm("Erase every entry, source and note on this device? This cannot be undone.")) return;
  if (!confirm("Really erase it all? Save a backup first if you're not sure.")) return;
  S = blank();
  save();
  UI.page = null;
  UI.tab = "home";
  render();
  toast("Everything erased");
}
/* ============================================================
   ROUTER + RENDER
   ============================================================ */
function go(page, arg) {
  UI.page = { name: page, arg: arg };
  window.scrollTo(0, 0);
  render();
}
function back() {
  UI.page = null;
  render();
}
const TABS = [
  { k: "home", label: "Home", icon: "home", page: pageHome },
  { k: "charts", label: "Charts", icon: "chart", page: pageCharts },
  { k: "people", label: "People", icon: "people", page: pagePeople },
  { k: "book", label: "Book", icon: "book", page: pageBook },
];

function render() {
  let body;
  if (UI.page) {
    const n = UI.page.name;
    body =
      n === "pot" ? pagePot(UI.page.arg)
      : n === "person" ? pagePerson(UI.page.arg)
      : n === "settings" ? pageSettings()
      : n === "plans" ? pagePlans()
      : pageHome();
  } else {
    const t = TABS.find((x) => x.k === UI.tab);
    body = t ? t.page() : pageHome();
  }
  $("#app").innerHTML = body;

  /* nav */
  const showing = UI.page && UI.page.name === "plans" ? "plans" : UI.page ? "" : UI.tab;
  const item = (t) =>
    '<button aria-pressed="' + (showing === t.k) + '" onclick="UI.tab=\'' + t.k + "';UI.page=null;render()\">" +
    icon(t.icon, 21) + '<span class="lab">' + t.label + "</span></button>";
  $("#nav").innerHTML =
    item(TABS[0]) + item(TABS[1]) +
    '<button class="fab" onclick="openAdd(\'expense\')" aria-label="Add a money movement">' + icon("plus", 24) + "</button>" +
    item(TABS[2]) +
    '<button aria-pressed="' + (showing === "plans") + '" onclick="go(\'plans\')">' + icon("note", 21) + '<span class="lab">Plans</span></button>';

  /* sheet */
  const m = $("#modal");
  if (UI.sheet) {
    const inner =
      UI.sheet.name === "entry" ? entrySheet()
      : UI.sheet.name === "confirmDelete" ? confirmDeleteSheet()
      : UI.sheet.name === "expected" ? expectedSheet()
      : UI.sheet.name === "recurring" ? recurringSheet()
      : "";
    m.innerHTML =
      '<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog" aria-modal="true">' +
      '<div class="grab"></div>' + inner + "</div></div>";
    document.body.style.overflow = "hidden";
  } else {
    m.innerHTML = "";
    document.body.style.overflow = "";
  }
}

/* search re-render that keeps the cursor in the box */
function renderSoft() {
  const el = document.getElementById("q");
  const pos = el ? el.selectionStart : null;
  render();
  const el2 = document.getElementById("q");
  if (el2) {
    el2.focus();
    if (pos != null) try { el2.setSelectionRange(pos, pos); } catch (e) {}
  }
}

/* the Book tab is where the search box lives, so route the nav there */
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && UI.sheet) closeSheet();
});

/* ============================================================
   BOOT
   ============================================================ */
load();
if (!S.entries.length && !localStorage.getItem(KEY)) save();
render();

/* first run: gentle nudge instead of an empty screen */
if (!S.entries.length) {
  setTimeout(() => toast("Tap + to log your first movement"), 700);
}
  if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
</body>
